name: "OQ-1 · Tier boundaries"
description: "Is a four-tier sovereignty classification right, or should Medium split into commercial-sensitive and personal?"
title: "[OQ-1] "
labels: ["peer-review", "OQ-1"]
body:
  - type: markdown
    attributes:
      value: |
        **OQ-1 — Tier boundaries.** Is a four-tier sovereignty classification right, or should Medium split into commercial-sensitive and personal?
        Sectors most wanted: Retail, FS & super. This issue is **public**. To contribute privately, use the Contribute section of the Assure Govern website instead.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Challenge (disputes a position or claim)
        - Correction (factual, date or mapping error)
        - Addition (new content)
        - Clarification (wording or ambiguity)
        - Endorsement
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where in ADSRA
      description: Document and section, slide, pillar or control ID (for example "Tech Ref §6.3" or "ADSRA-CR-03").
    validations:
      required: true
  - type: textarea
    id: point
    attributes:
      label: Your point
      description: Which tier(s) and data classes does your point concern, and what boundary would you draw instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Primary sources (regulator, legislation, provider documentation) and the date you checked each one. Anecdote helps; evidence decides.
    validations:
      required: true
  - type: input
    id: sector
    attributes:
      label: Your sector
      description: Banking, FS & super, retail, healthcare, utilities, education, cross-industry, other.
  - type: textarea
    id: interests
    attributes:
      label: Interests to declare
      description: Do you work for, or sell, a product this point concerns? It does not disqualify the point.
  - type: dropdown
    id: credit
    attributes:
      label: Credit
      options:
        - Credit me by my GitHub name
        - Do not credit me by name
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Contribution terms
      options:
        - label: I have read CONTRIBUTING.md, including the open legal item on contributor terms (draft, not yet in effect).
          required: true
