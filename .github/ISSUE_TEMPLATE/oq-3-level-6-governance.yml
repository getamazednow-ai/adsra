name: "OQ-3 · Level 6 governance"
description: "What evidence would convince a regulator that agentic (Level 6) remediation is itself well governed?"
title: "[OQ-3] "
labels: ["peer-review", "OQ-3", "received"]
body:
  - type: markdown
    attributes:
      value: |
        **OQ-3 — Level 6 governance.** What evidence would convince a regulator that agentic (Level 6) remediation is itself well governed?
        Sectors most wanted: Risk / regulatory, banking.
        **This issue is public and permanent.** Anyone can read it, and editing or deleting it later may not remove it from notifications, caches or copies.
        **Do not include client information, personal data, credentials or confidential workload details.** Describe the point in general terms.
        To contribute privately, use the Contribute section of the Assure Govern website. If something sensitive has already been posted, report it privately — see SECURITY.md.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Challenge (disputes a position or claim)
        - Correction (factual, date or mapping error)
        - Addition (new content)
        - Clarification (wording or ambiguity)
        - Endorsement
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where in ADSRA
      description: Document and section, slide, pillar or control ID (for example "Tech Ref §6.3" or "ADSRA-CR-03").
    validations:
      required: true
  - type: textarea
    id: point
    attributes:
      label: Your point
      description: What evidence, controls or oversight would you expect to see — and from which regulator expectation does that come?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Primary sources (regulator, legislation, provider documentation) and the date you checked each one. Anecdote helps; evidence decides.
    validations:
      required: true
  - type: input
    id: sector
    attributes:
      label: Your sector
      description: Banking, FS & super, retail, healthcare, utilities, education, cross-industry, other.
  - type: textarea
    id: interests
    attributes:
      label: Interests to declare
      description: Do you work for, or sell, a product this point concerns? It does not disqualify the point.
  - type: dropdown
    id: credit
    attributes:
      label: Credit
      options:
        - Credit me by my GitHub name
        - Do not credit me by name
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Contribution terms
      options:
        - label: I have read CONTRIBUTING.md, including the open legal item on contributor terms (draft, not yet in effect).
          required: true
        - label: I have not included client information, personal data, credentials or confidential workload details.
          required: true
